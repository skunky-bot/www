name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p ./_site
          cp index.html CNAME ./_site/
          touch ./_site/.nojekyll
          if [ -f favicon.ico ]; then cp favicon.ico ./_site/; fi
          if [ -d assets ]; then cp -r assets ./_site/assets; fi
          if [ -d public ]; then cp -r public ./_site/public; fi
          # Preserve the root homepage and isolated Skunky preview.
          if [ -d skunky ]; then cp -r skunky ./_site/skunky; fi
          if [ -f skunky_landing_card.html ]; then cp skunky_landing_card.html ./_site/; fi
          test -s ./_site/index.html
          test -s ./_site/CNAME

      - name: Set artifact name
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./_site
          name: ${{ steps.artifact.outputs.name }}
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
