# Development integration overlay. Clone sibling repositories: ../api ../search ../scan ../collect
# Do not expose these services or use example credentials in production.
services:
  skunky-api:
    build: ../api
    environment:
      DATABASE_URL: sqlite:////tmp/skunky-preview.db
      SECRET_KEY: ${SKUNKY_JWT_SECRET:?Set a strong random signing key}
      BOOTSTRAP_ADMIN_USERNAME: ${SKUNKY_ADMIN_USERNAME:?Set bootstrap administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${SKUNKY_ADMIN_PASSWORD:?Set unique administrator password}
      BOOTSTRAP_ADMIN_EMAIL: ${SKUNKY_ADMIN_EMAIL:?Set administrator email}
      SKUNKY_SEARCH_URL: http://search:8000
      SKUNKY_SCAN_URL: http://scan:8000
      SKUNKY_COLLECT_URL: http://collect:8000
      SKUNKY_SERVICE_TOKEN: ${SKUNKY_SERVICE_TOKEN:?Required}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on: [search, scan, collect]
  search:
    build: ../search
    environment:
      SKUNKY_SERVICE_TOKEN: ${SKUNKY_SERVICE_TOKEN:?Required}
  scan:
    build: ../scan
    environment:
      SKUNKY_SERVICE_TOKEN: ${SKUNKY_SERVICE_TOKEN:?Required}
  collect:
    build: ../collect
    environment:
      SKUNKY_SERVICE_TOKEN: ${SKUNKY_SERVICE_TOKEN:?Required}
